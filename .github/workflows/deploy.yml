name: Deploy website to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 1. Force the configuration to use GitHub Pages
  config:
    runs-on: ubuntu-latest
    outputs:
      deploy-host: github-pages
    steps:
      - name: Force GitHub Pages Config
        id: check
        run: |
          echo "host=github-pages" >> $GITHUB_OUTPUT

  # 2. Build the site
  build:
    needs: config
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # 3. Deploy the site
  deploy:
    needs: [config, build]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
